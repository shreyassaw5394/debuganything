# One-shot helper: publishes a tagged release of shreyassaw5394/clip-anything to PyPI with this
# repo's PYPI_TOKEN secret. Temporary until clip-anything's own trusted publisher is configured;
# delete this file after that.
name: Publish clip-anything to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "clip-anything tag to publish (e.g. v0.5.2)"
        required: true
        default: "v0.5.2"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shreyassaw5394/clip-anything
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ inputs.ref }}
        run: |
          v=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "$TAG" ] || { echo "tag $TAG != version $v"; exit 1; }
      - run: uv build
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*
